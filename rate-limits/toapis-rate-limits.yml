notes: >-
  Published limits cover async image/video task submission and status queries only;
  two independent token buckets that do not consume synchronous model-request quota.
  Limits are counted per user ID, not per token — all tokens owned by one user share
  the bucket. Business failures count; requests rejected with 429 do not. A batch
  status query counts as one request (max 100 task IDs). Synchronous chat/completion
  rate limits are not published. Rate-limit groups (default/vip/svip) are account
  tiers assigned by the provider.
