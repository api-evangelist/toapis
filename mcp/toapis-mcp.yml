notes: >-
  This is a documentation MCP server generated by the Mintlify docs platform for
  docs.toapis.com, not an API-execution server: its tools search and read the ToAPIs
  documentation corpus and file docs feedback. It answers anonymous tools/list with
  full inputSchemas. ToAPIs ships no MCP server that calls the gateway API itself;
