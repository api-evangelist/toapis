tools:
  - name: search_to_ap_is_documentation
    title: Search documentation
    description: >-
      Search across the ToAPIs Documentation knowledge base for relevant
      information, code examples, API references, and guides. Returns contextual
      content with titles and direct links to documentation pages.
    input:
      query: string (required)
      language: string (optional language code filter, defaults to en)
    annotations:
      readOnlyHint: true
      idempotentHint: true
  - name: query_docs_filesystem_to_ap_is_documentation
    title: Query docs filesystem
    description: >-
      Read-only shell-like queries (rg, grep, find, tree, ls, cat, head, tail, jq,
      etc.) against a virtualized in-memory filesystem containing the ToAPIs
      documentation pages. Stateless per call; output truncated to 30KB.
    input:
      command: string (required)
    annotations:
      readOnlyHint: true
      idempotentHint: true
  - name: submit_feedback
    title: Submit documentation feedback
    description: >-
      Report a problem with a documentation page (incorrect, outdated, confusing,
      incomplete, or broken example) to the docs team.
    input:
      path: string (required, docs page path)
      feedback: string (required)
    annotations:
      readOnlyHint: false
